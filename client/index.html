<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="AI Powered Escape Room — a browser-based 3D horror escape experience" />
  <meta name="theme-color" content="#07070c" />
  <title>AI Powered Escape Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/ui/styles/main.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗝</text></svg>" />
</head>
<body>
  <!-- 3D viewport -->
  <canvas id="game-canvas" aria-label="3D game viewport"></canvas>

  <!-- UI root — screens are injected here by the ScreenManager -->
  <div id="ui-root"></div>

  <!-- Vignette / damage overlay -->
  <div id="fx-overlay" aria-hidden="true"></div>

  <noscript>
    <div style="color:#eee;font-family:sans-serif;padding:40px;text-align:center">
      AI Powered Escape Room requires JavaScript and WebGL 2.
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
