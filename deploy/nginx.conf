server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / { try_files $uri /index.html; }

    location /api/   { proxy_pass http://api:5000; proxy_set_header Host $host; }
    location /admin/ { proxy_pass http://api:5000; proxy_set_header Host $host; }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types application/javascript text/css application/wasm application/json;
}
