# Render blueprint — Flask backend for AI Powered Escape Room.
#
# Deploy: push this repo to GitHub, then in Render:
#   New  →  Blueprint  →  pick this repo  →  Apply.
# Set ADMIN_PASSWORD (min 8 chars) in the dashboard when prompted; the app
# auto-creates the DB tables, seeds reference data, and ensures the admin user
# on first boot (AUTO_BOOTSTRAP=1). No shell access required.
services:
  - type: web
    name: escape-room-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: 'gunicorn "app:create_app()" --chdir server -b 0.0.0.0:$PORT'
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production        # turns Flask debug OFF (never expose it publicly)
      - key: AUTO_BOOTSTRAP
        value: "1"               # seed reference data + ensure admin on boot
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false              # <-- set your own in the dashboard (min 8 chars)
      - key: OPENAI_API_KEY
        sync: false              # optional — blank uses the offline generator
      - key: DATABASE_URL
        fromDatabase:
          name: escape-room-db
          property: connectionString

databases:
  - name: escape-room-db
    plan: free
    databaseName: escape_room
    user: escape_room
